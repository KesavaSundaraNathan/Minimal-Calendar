<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="An ultra-minimal, local-first calendar and daily progress tracker.">
  <meta name="theme-color" content="#000000">
  <title>Authenwrite Calendar</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">
  <link rel="stylesheet" href="src/styles/global.css">
</head>
<body>
  <div id="banner" class="banner hidden"></div>

  <header class="app-header">
    <div class="header-left">
      <button class="icon" id="help-btn" aria-label="How this app works" title="How this app works">?</button>
    </div>
    <div class="header-center">
      <button class="icon nav-arrow" id="prev-month" aria-label="Previous period">‹</button>
      <h1 id="month-label">January - 26</h1>
      <button class="icon nav-arrow" id="next-month" aria-label="Next period">›</button>
    </div>
    <div class="header-right">
      <button class="icon" id="theme-toggle" aria-label="Toggle theme">☾</button>
      <button class="icon badge" id="badge" aria-label="Today's pending tasks">
        <span class="bell">◔</span>
        <span class="badge-count">0</span>
      </button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <footer class="app-footer">
    <button class="circle-btn" id="settings-btn" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <rect x="3" y="5" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"></rect>
        <line x1="3" y1="10" x2="21" y2="10" stroke="currentColor" stroke-width="1.6"></line>
        <line x1="8" y1="3" x2="8" y2="7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></line>
        <line x1="16" y1="3" x2="16" y2="7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></line>
      </svg>
    </button>
    <p id="message" class="footer-message"></p>
    <span class="footer-right">
      <span class="spinner hidden" id="footer-spinner" aria-hidden="true"></span>
      <span class="view-switch">
        <div class="view-menu hidden" id="view-menu" role="menu">
          <button class="menu-item" data-view="month" role="menuitem">Calendar view</button>
          <button class="menu-item" data-view="week" role="menuitem">Weekly view</button>
          <button class="menu-item" data-view="day" role="menuitem">Daily view</button>
        </div>
        <button class="circle-btn" id="view-btn" aria-label="Switch view" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path d="M2 12s3.8-6 10-6 10 6 10 6-3.8 6-10 6S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.6"></path>
            <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"></circle>
          </svg>
        </button>
      </span>
    </span>
  </footer>

  <script type="module" src="src/index.js"></script>
</body>
</html>
